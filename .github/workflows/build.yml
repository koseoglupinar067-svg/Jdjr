name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract ZIP
        run: |
          mkdir -p source
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP bulunamadi!"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

      - name: Find Project
        run: |
          find source -name "settings.gradle*" -o -name "build.gradle*" | head -50

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$(find source -name "settings.gradle*" -type f | head -n 1)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Gradle projesi bulunamadi!"
            exit 1
          fi

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          gradle clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: built-jars
          path: |
            source/**/build/libs/*.jar
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apks
          path: |
            source/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
